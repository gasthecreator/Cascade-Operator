# Builds the manager image, publishes it to GHCR, and signs it keylessly
# with cosign (Sigstore) — closes docs/security-threat-model.md's "No image
# signing or provenance verification" known gap. Also attaches an SBOM and
# SLSA provenance attestation via docker/build-push-action's own built-in
# support, so "provenance" in that gap's title is covered too, not just
# the signature.
#
# Two entry points, one implementation:
#   - workflow_dispatch: exercise and verify the pipeline on demand. Publishes
#     ghcr.io/<owner>/cascade-operator:<short-sha> only.
#   - workflow_call: used by release.yml on a version tag, so a release builds
#     and signs the image exactly once. Tag runs additionally publish :<tag>
#     and :latest.
# The tag trigger that used to live here moved to release.yml; keeping both
# would build and sign every tag twice.
name: Publish image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Lower-case image repository, without tag or digest
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Digest of the published image (sha256:...)
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign's keyless OIDC signing
    name: Build, push, and sign
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Docker image references require a lowercase repository name;
          # github.repository preserves this repo's real mixed-case name
          # (gasthecreator/Cascade-Operator) verbatim — confirmed live
          # this failed the very first run without the lowercasing below
          # ("invalid tag ...: repository name must be lowercase").
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          TAGS="${IMAGE}:$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${IMAGE}:${REF_TAG},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >>"${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >>"${GITHUB_OUTPUT}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image (keyless)
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME,,}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}

# Kind + Istio integration tests (PLAN.md §5 Phase 1). Separate from
# test-e2e.yml — that scaffold targets a plain Kind cluster with no mesh.
name: Integration Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  integration:
    permissions:
      contents: read
    name: Kind + Istio 1.30.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTEGRATION_CONTEXT: kind-cascade-operator
      ISTIO_VERSION: "1.30.4"
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create Kind cluster
        run: |
          kind create cluster --name cascade-operator
          kubectl cluster-info --context "${INTEGRATION_CONTEXT}"

      - name: Install Istio
        run: make istio-install

      - name: Install CascadePolicy CRDs
        run: kubectl apply -f config/crd/bases

      - name: Run integration tests
        run: |
          go mod tidy
          make test-integration

# Kind + Istio + Linkerd integration tests (PLAN.md §5 Phase 1, extended
# for Phase 6.6's Linkerd multi-mesh support). Separate from test-e2e.yml
# — that scaffold targets a plain Kind cluster with no mesh.
#
# Both meshes install onto the same Kind cluster, in disjoint namespaces
# (Istio's demo topology in `default`, Linkerd's in `linkerd-demo`) — the
# same one-cluster-two-meshes shape this project's own dev environment has
# used since PLAN.md §5 Phase 6.6's own spike, confirmed there not to
# conflict as long as injected workloads stay in separate namespaces.
# test/integration's Linkerd tests (test/integration/linkerd_*.go) already
# skip cleanly if the ServiceProfile CRD is missing — this workflow is
# what makes them actually run instead of skip.
name: Integration Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  integration:
    permissions:
      contents: read
    name: Kind + Istio 1.31.0 + Linkerd edge-26.6.3
    runs-on: ubuntu-latest
    # Bumped from 30: a second mesh control plane (Gateway API CRDs +
    # Linkerd + linkerd-viz, on top of Istio + Prometheus) is real extra
    # install time on a fresh cluster, not just this repo's own test suite.
    timeout-minutes: 40
    env:
      INTEGRATION_CONTEXT: kind-cascade-operator
      ISTIO_VERSION: "1.31.0"
      LINKERD_VERSION: "edge-26.6.3"
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create Kind cluster
        run: |
          kind create cluster --name cascade-operator
          kubectl cluster-info --context "${INTEGRATION_CONTEXT}"

      - name: Install Istio
        run: make istio-install

      - name: Install Linkerd
        run: make linkerd-install

      - name: Install CascadePolicy CRDs
        run: kubectl apply -f config/crd/bases

      - name: Run integration tests
        run: |
          go mod tidy
          make test-integration

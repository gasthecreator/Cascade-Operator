apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: linkerd-demo
  labels:
    app: payments-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
    spec:
      containers:
        - name: payments
          image: cascade-demo-payments:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-service
  namespace: linkerd-demo
  labels:
    app: payments-service
spec:
  selector:
    app: payments-service
  ports:
    - port: 80
      targetPort: 8080

apiVersion: cascade.gideonsanni.dev/v1alpha1
kind: CascadePolicy
metadata:
  labels:
    app.kubernetes.io/name: cascade-operator
    app.kubernetes.io/managed-by: kustomize
  name: checkout-service
  namespace: default
spec:
  service: checkout-service.default.svc.cluster.local
  dependsOn:
    - payments-service.default.svc.cluster.local
    - inventory-service.default.svc.cluster.local
  thresholds:
    latencyP99Ms: 500
    errorRateFraction: 0.05
    windowSeconds: 30
    retryStormMultiplier: 3.0
    fanOutMultiplier: 5.0
  # thresholdOverrides (PLAN.md §5): optional, keyed by a dependsOn FQDN.
  # Unset fields on an override fall back to thresholds' own value — here,
  # payments-service gets a stricter latency threshold (it's on the
  # request path for every checkout, so a slower cascade tolerance makes
  # sense there) while every other threshold and every other dependency
  # still uses the policy-wide thresholds above unmodified.
  thresholdOverrides:
    payments-service.default.svc.cluster.local:
      latencyP99Ms: 300
  mode: Mitigate

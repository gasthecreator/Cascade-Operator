---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-cascade-gideonsanni-dev-v1alpha1-cascadepolicy
  failurePolicy: Fail
  name: vcascadepolicy-v1alpha1.kb.io
  rules:
  - apiGroups:
    - cascade.gideonsanni.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cascadepolicies
  sideEffects: None

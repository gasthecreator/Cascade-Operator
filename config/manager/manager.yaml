apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cascade-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cascade-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cascade-operator
  # PLAN.md §5 Phase 5 (HA): 2, not 1 — leader election (--leader-elect,
  # already passed below) is what makes this safe: exactly one replica
  # actively reconciles at a time, the other stands by as a hot spare so a
  # pod eviction/crash doesn't leave the CascadePolicy watch unattended
  # until a new pod schedules and image-pulls from cold.
  replicas: 2
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        # Harmless when this pod is never mesh-injected (Linkerd-specific
        # annotations are simply ignored without a linkerd-proxy sidecar);
        # required once it is (hack/deploy-operator.sh's mesh-injection
        # step, needed for linkerd-viz's own locked-down Prometheus — see
        # docs/security-threat-model.md's own trust-boundary entry).
        # Confirmed live (2026-09-04) that without this, the manager's own
        # leader-election/API-server calls to the `kubernetes` Service
        # (ClusterIP:443) fail with repeated "connection reset by peer"
        # once the pod has a linkerd-proxy sidecar — the sidecar
        # intercepting and proxying that traffic breaks it, a known
        # operational pattern for any controller-runtime-based client
        # (client-go, kubectl) running inside a mesh. Excluding port 443
        # from outbound interception lets that specific traffic bypass the
        # proxy entirely, same as Linkerd's own docs recommend for
        # anything talking directly to the API server.
        config.linkerd.io/skip-outbound-ports: "443"
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: cascade-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      # PLAN.md §5 Phase 5 (HA): preferred, not required — two replicas on
      # different nodes survive a single node loss; "preferred" (not
      # "required") so this doesn't block scheduling on a single-node dev
      # cluster (Kind) where a "required" rule would leave the second
      # replica permanently Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    control-plane: controller-manager
                    app.kubernetes.io/name: cascade-operator
                topologyKey: kubernetes.io/hostname
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10

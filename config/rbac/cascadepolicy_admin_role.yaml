# This rule is not used by the project cascade-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cascade.gideonsanni.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cascade-operator
    app.kubernetes.io/managed-by: kustomize
  name: cascadepolicy-admin-role
rules:
- apiGroups:
  - cascade.gideonsanni.dev
  resources:
  - cascadepolicies
  verbs:
  - '*'
- apiGroups:
  - cascade.gideonsanni.dev
  resources:
  - cascadepolicies/status
  verbs:
  - get
